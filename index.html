            code: `DC${core}-D${disc}`,
            core: core.toString(),
            disc: disc,
            flowRates: flowsByDisc[disc] // object: { "10": 0.xx, "20": 0.xx, ... }
        });
    }
}

// Helper: get flow for a nozzle & PSI
function getFlowRate(nozzleCode, psi) {
    const nozzle = teejetNozzles.find(n => n.code === nozzleCode);
    if (!nozzle) return 0;
    return nozzle.flowRates[String(psi)] || 0;
}

// Populate nozzle type dropdown
function updateNozzleType() {
    const category = document.getElementById('nozzleCategory').value;
    const typeSelect = document.getElementById('nozzleType');
    typeSelect.innerHTML = '';

    let options = [];
    if (category === '') {
        options = teejetNozzles.map(n => n.code);
    } else if (category === 'ai') {
        options = ['AI01','AI015','AI02','AI025','AI03','AI035','AI04','AI05','AI06','AI08','AI10'];
    }

    options.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.toLowerCase();
        option.textContent = opt.toUpperCase();
        typeSelect.appendChild(option);
    });

    updateNozzleInfo();
}
